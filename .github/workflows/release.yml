name: Release

# Pushing a tag like v1.2.3 tests, builds, attests and publishes a release.
# Releases are created as drafts, every file is attached, and only then
# published, so with "release immutability" enabled the published release
# (tag, commit and files) can never be changed afterwards.
on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  GO_VERSION: "1.24.7" # keep in sync with ci.yml and docs/VERIFY.md
  CGO_ENABLED: "0"
  GOTOOLCHAIN: local

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  build:
    needs: ci
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false

      - name: Release metadata
        id: meta
        run: |
          set -eu
          version="${GITHUB_REF_NAME}"
          case "$version" in v[0-9]*.[0-9]*.[0-9]*) ;; *) echo "::error::bad tag $version"; exit 1;; esac
          echo "version=$version" >> "$GITHUB_OUTPUT"
          # fixed timestamps make the archives byte-for-byte reproducible
          echo "SOURCE_DATE_EPOCH=$(git log -1 --format=%ct)" >> "$GITHUB_ENV"

      - name: Build and package
        run: |
          set -eu
          v="${{ steps.meta.outputs.version }}"
          mkdir -p dist stage
          pack() { # pack <dir> <format>
            dir="$1"; fmt="$2"
            find "stage/$dir" -exec touch -h -d "@$SOURCE_DATE_EPOCH" {} +
            if [ "$fmt" = zip ]; then
              (cd stage && find "$dir" -print | LC_ALL=C sort | zip -X -D -q -@ "../dist/$dir.zip")
            else
              tar --sort=name --mtime="@$SOURCE_DATE_EPOCH" --owner=0 --group=0 --numeric-owner \
                -C stage -cf - "$dir" | gzip -n -9 > "dist/$dir.tar.gz"
            fi
          }

          # Windows: the overlay app plus the command-line planner
          for arch in amd64 arm64; do
            d="bardraw-$v-windows-$arch"
            mkdir -p "stage/$d"
            GOOS=windows GOARCH=$arch go build -trimpath -ldflags "-s -w -H=windowsgui" -o "stage/$d/bardraw.exe" .
            GOOS=windows GOARCH=$arch go build -trimpath -ldflags "-s -w" -o "stage/$d/svgplan.exe" ./cmd/svgplan
            cp README.md "stage/$d/"
            [ -f LICENSE ] && cp LICENSE "stage/$d/"
            cp "stage/$d/bardraw.exe" "dist/bardraw-$v-windows-$arch.exe"
            pack "$d" zip
          done

          # Linux: the planner / preview tool (the overlay itself is Windows-only)
          for arch in amd64 arm64; do
            d="svgplan-$v-linux-$arch"
            mkdir -p "stage/$d"
            GOOS=linux GOARCH=$arch go build -trimpath -ldflags "-s -w" -o "stage/$d/svgplan" ./cmd/svgplan
            cp README.md "stage/$d/"
            [ -f LICENSE ] && cp LICENSE "stage/$d/"
            pack "$d" tgz
          done

          (cd dist && sha256sum -- * | LC_ALL=C sort -k2 > SHA256SUMS.txt)
          cat dist/SHA256SUMS.txt

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: build
    runs-on: ubuntu-latest
    # Optional gate: add required reviewers to the "release" environment in
    # Settings → Environments to approve every release by hand.
    environment: release
    permissions:
      contents: write     # create the release
      id-token: write     # sign the provenance attestation (Sigstore, keyless)
      attestations: write # store the attestation on GitHub
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/*.zip
            dist/*.tar.gz
            dist/*.exe
            dist/SHA256SUMS.txt

      - name: Create draft, upload, publish
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          set -eu
          if gh release view "$VERSION" >/dev/null 2>&1; then
            echo "::error::Release $VERSION already exists. Published releases are immutable; tag a new version."
            exit 1
          fi
          cat > notes.md <<EOF
          ### Downloads
          * **Windows (the overlay):** \`bardraw-$VERSION-windows-amd64.zip\` (Windows on ARM: \`-arm64\`). Unzip and run \`bardraw.exe\`. The bare \`.exe\` is the same file.
          * **Linux:** \`svgplan-$VERSION-linux-*.tar.gz\`, the command-line planner and preview renderer. The overlay itself runs on Windows only.

          ### Verify your download
          Every file was built by GitHub Actions from commit \`$GITHUB_SHA\` of this repository, and that is cryptographically attested:
          \`\`\`
          gh attestation verify <file> --repo $GITHUB_REPOSITORY
          gh release verify-asset $VERSION <file> --repo $GITHUB_REPOSITORY
          \`\`\`
          Built with Go $GO_VERSION; the binaries are reproducible. See [docs/VERIFY.md](https://github.com/$GITHUB_REPOSITORY/blob/$VERSION/docs/VERIFY.md).

          EOF
          gh release create "$VERSION" --draft --verify-tag --title "bardraw $VERSION" \
            --notes-file notes.md --generate-notes
          gh release upload "$VERSION" dist/*
          gh release edit "$VERSION" --draft=false --latest
          echo "Published https://github.com/$GITHUB_REPOSITORY/releases/tag/$VERSION"

      - name: Check the release is immutable
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          if gh release verify "$VERSION"; then
            echo "Release is immutable and attested."
          else
            echo "::warning::Release is NOT immutable. Enable it under Settings → Releases → Enable release immutability (see docs/RELEASING.md)."
          fi
